<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#aa851e" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cabeza y Cabello -->
  <path d="M280,180 C270,160 275,130 300,120 C325,110 345,130 345,155 C345,175 335,190 320,195" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M285,145 C270,140 260,160 260,180 C260,205 275,225 285,240" stroke="url(#goldGrad)"/>
  <path d="M330,135 C350,135 365,150 365,175 C365,210 340,240 330,255" stroke="url(#goldGrad)"/>
  
  <!-- Venda de los ojos (Símbolo de Imparcialidad) -->
  <polygon points="280,150 335,140 340,162 285,172" fill="#0d0d0d" stroke="#d4af37" stroke-width="2.5"/>
  <line x1="282" y1="161" x2="338" y2="151" stroke="#f3e5ab" stroke-width="1.5"/>
  <path d="M340,155 Q360,165 375,185" stroke="#d4af37" stroke-dasharray="3,3"/>

  <!-- Perfil Facial y Cuello -->
  <path d="M305,172 L308,185 L315,186" stroke="#d4af37"/>
  <path d="M305,198 Q312,201 318,198" stroke="#d4af37"/>
  <path d="M295,205 Q308,218 322,208" stroke="#d4af37"/>
  <path d="M295,215 Q290,240 285,255" stroke="#d4af37"/>
  <path d="M325,215 Q330,240 335,255" stroke="#d4af37"/>

  <!-- Torso y Túnica Griega (Drapeado Clásico) -->
  <path d="M285,255 Q240,270 210,310 Q195,330 190,360" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M335,255 Q380,270 410,310 Q425,330 430,360" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Pliegues del escote y túnica -->
  <path d="M285,255 Q310,290 335,255" stroke="#d4af37" stroke-width="2"/>
  <path d="M270,280 Q310,320 350,280" stroke="#d4af37"/>
  <path d="M250,310 Q310,360 370,310" stroke="#d4af37"/>
  <path d="M230,350 Q310,410 390,350" stroke="#d4af37"/>
  <path d="M260,320 Q240,400 240,490 Q240,620 220,780" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M360,320 Q380,400 380,490 Q380,620 400,780" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M310,360 L310,790" stroke="#d4af37" stroke-opacity="0.5"/>
  <path d="M285,380 Q290,550 270,780" stroke="#d4af37" stroke-opacity="0.6"/>
  <path d="M335,380 Q330,550 350,780" stroke="#d4af37" stroke-opacity="0.6"/>

  <!-- Cinturón de la Justicia -->
  <path d="M245,410 Q310,435 375,410" stroke="#f3e5ab" stroke-width="3"/>
  <ellipse cx="310" cy="422" rx="8" ry="8" fill="#d4af37"/>

  <!-- Brazo Derecho alzando la Balanza de la Justicia -->
  <path d="M210,310 Q160,260 140,200 Q130,160 135,130" stroke="url(#goldGrad)" stroke-width="2.8"/>
  <circle cx="136" cy="126" r="7" fill="#d4af37"/>
  
  <!-- Balanza de la Justicia (Símbolo de Equidad) -->
  <!-- Viga central de la balanza -->
  <line x1="60" y1="165" x2="210" y2="165" stroke="#f3e5ab" stroke-width="3" filter="url(#glow)"/>
  <circle cx="135" cy="165" r="5" fill="#f3e5ab"/>
  <line x1="135" y1="130" x2="135" y2="165" stroke="#f3e5ab" stroke-width="2.5"/>

  <!-- Platillo Izquierdo -->
  <line x1="60" y1="165" x2="35" y2="230" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="60" y1="165" x2="85" y2="230" stroke="#d4af37" stroke-width="1.5"/>
  <path d="M25,230 Q60,250 95,230 Z" fill="rgba(212,175,55,0.15)" stroke="#f3e5ab" stroke-width="2"/>

  <!-- Platillo Derecho -->
  <line x1="210" y1="165" x2="185" y2="230" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="210" y1="165" x2="235" y2="230" stroke="#d4af37" stroke-width="1.5"/>
  <path d="M175,230 Q210,250 245,230 Z" fill="rgba(212,175,55,0.15)" stroke="#f3e5ab" stroke-width="2"/>

  <!-- Brazo Izquierdo sosteniendo la Espada hacia abajo -->
  <path d="M410,310 Q450,380 460,460 Q465,510 460,550" stroke="url(#goldGrad)" stroke-width="2.8"/>
  <!-- Empuñadura de la Espada -->
  <circle cx="458" cy="555" r="6" fill="#f3e5ab"/>
  <line x1="440" y1="562" x2="480" y2="562" stroke="#f3e5ab" stroke-width="4"/>
  <!-- Hoja de la Espada (Símbolo de Fuerza y Ley) -->
  <path d="M455,562 L455,820 L460,845 L465,820 L465,562 Z" fill="rgba(243,229,171,0.2)" stroke="#f3e5ab" stroke-width="2" filter="url(#glow)"/>
  <line x1="460" y1="565" x2="460" y2="825" stroke="#ffffff" stroke-width="1"/>
</svg>
