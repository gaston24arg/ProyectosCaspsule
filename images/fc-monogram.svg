<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8b7"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa851e"/>
      <stop offset="100%" stop-color="#ffd966"/>
    </linearGradient>
    <filter id="monogramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Letra F estilizada y entrelazada -->
  <g filter="url(#monogramGlow)">
    <!-- Barra vertical F -->
    <path d="M52,22 L66,22 L66,98 L52,98 Z" fill="url(#goldMetallic)"/>
    <!-- Barra superior F -->
    <path d="M66,22 L102,22 C106,22 108,25 106,29 L103,36 L66,36 Z" fill="url(#goldMetallic)"/>
    <!-- Barra media F con remate clásico -->
    <path d="M66,54 L92,54 C95,54 97,57 95,60 L93,66 L66,66 Z" fill="url(#goldMetallic)"/>
    
    <!-- Letra C entrelazada con curvas y serifas romanas -->
    <path d="M124,38 C116,26 102,20 86,24 C82,25 79,28 78,32 L84,36 C87,34 91,33 95,33 C108,33 115,44 115,59 C115,74 107,87 93,87 C87,87 82,84 79,80 L73,85 C77,91 85,98 96,98 C116,98 130,82 130,59 C130,49 128,43 124,38 Z" fill="url(#goldMetallic)"/>
  </g>
</svg>
